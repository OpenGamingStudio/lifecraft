<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00a6b4">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LifeCraft</title>
  <meta name="description" content="LifeCraft : jeu de sandbox et de survie 2D, minage, construction et exploration, dans le navigateur.">
</head>
<body>
  <canvas id="game" aria-label="LifeCraft" class="fixed inset-0 block size-full cursor-crosshair touch-none select-none"></canvas>
  <div id="touch" class="pointer-events-none fixed inset-0 hidden [&.on]:block">
    <button class="plaque biseau-a btn-touch btn-dir size-[76px] bottom-(--sol) left-[calc(14px+env(safe-area-inset-left))]" id="bLeft" aria-label="Gauche"><svg class="ico" viewBox="0 0 8 8" aria-hidden="true"><path d="M5 1h1v6H5zM4 2h1v4H4zM3 3h1v2H3zM2 3.5h1v1H2z"/></svg></button>
    <button class="plaque biseau-b btn-touch btn-dir size-[76px] bottom-(--sol) left-[calc(102px+env(safe-area-inset-left))]" id="bRight" aria-label="Droite"><svg class="ico" viewBox="0 0 8 8" aria-hidden="true"><path d="M2 1h1v6H2zM3 2h1v4H3zM4 3h1v2H4zM5 3.5h1v1H5z"/></svg></button>
    <button class="plaque biseau-c btn-touch h-14 w-[88px] right-[calc(14px+env(safe-area-inset-right))] bottom-[calc(var(--sol)+98px)]" id="bMode" data-mode="mine" aria-label="Basculer miner ou poser">Miner</button>
    <button class="plaque biseau-a btn-touch size-[88px] right-[calc(14px+env(safe-area-inset-right))] bottom-(--sol)" id="bJump" aria-label="Sauter"><svg class="ico" viewBox="0 0 8 8" aria-hidden="true"><path d="M3.5 0h1v1h-1zM3 1h2v1H3zM2 2h4v1H2zM1 3h6v1H1zM3 4h2v4H3z"/></svg></button>
  </div>
  <div id="safe" class="pointer-events-none invisible fixed pt-[env(safe-area-inset-top)] pr-[env(safe-area-inset-right)] pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)]" aria-hidden="true"></div>
  <button class="plaque biseau-b btn-touch pointer-events-auto fixed! size-11 top-[calc(10px+env(safe-area-inset-top))] right-[calc(10px+env(safe-area-inset-right))]" id="menuBtn" aria-label="Menu"><svg class="ico" viewBox="0 0 8 8" aria-hidden="true"><path d="M1 1h6v1H1zM1 3.5h6v1H1zM1 6h6v1H1z"/></svg></button>
  <div id="menu" class="fixed inset-0 hidden overflow-y-auto p-4 [&.on]:flex" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="plaque biseau-d m-auto w-full max-w-[360px]">
      <div class="bandeau px-5 pb-2.5 pt-3.5">
        <h1 class="m-0 origin-left -rotate-2 text-[46px] font-bold leading-[0.95]">LifeCraft</h1>
      </div>
      <div class="px-5 pb-5 pt-3.5">
        <p class="m-0 text-[17px] font-medium leading-snug">Creuse, bâtis, explore. Sauvegarde dans ce navigateur.</p>
        <button class="plaque biseau-a btn-menu btn-principal" id="mResume">Reprendre</button>
        <button class="plaque biseau-b btn-menu" id="mSound">Son : activé</button>
        <button class="plaque biseau-c btn-menu" id="mNew">Nouveau monde</button>
        <ul class="note m-0 mt-4 list-none px-3.5 py-2.5 text-[15px] leading-[1.4]">
          <li><b class="font-semibold">Marcher</b> A, D ou flèches</li>
          <li><b class="font-semibold">Sauter</b> Espace ou W</li>
          <li><b class="font-semibold">Miner</b> clic · <b class="font-semibold">Poser</b> clic droit</li>
          <li><b class="font-semibold">Case</b> 1 à 9 ou molette</li>
          <li><b class="font-semibold">Son</b> M · <b class="font-semibold">Menu</b> Échap</li>
          <li><b class="font-semibold">Au doigt</b> boutons à l'écran, touche le monde</li>
        </ul>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
